[project]
name = "use-python"
version = "1.0.0"
description = "Shared Python environment for courses at Utrecht University School of Economics"
requires-python = ">=3.12"
dependencies = [
    # Environment
    "jupyterlab",
    "ipywidgets",

    # Data
    "pandas",
    "polars",
    "polars-ds",  # data-science extensions for polars
    "polars-ols",  # OLS regression for polars
    "numpy",
    "pyarrow",
    "openpyxl",
    "xlrd",  # opening excel legacy format
    "fastexcel",  # fast excel reading (polars backend)

    # Data access
    "requests",
    "yfinance",
    "wrds",
    "openassetpricing",
    "tidyfinance",

    # Web scraping / HTML tables
    "beautifulsoup4",
    "html5lib",
    "lxml",

    # Statistics / econometrics
    "scipy",
    "statsmodels",
    "linearmodels",
    "pyfixest",
    "scikit-learn",
    "arch",

    # Portfolio optimization
    "PyPortfolioOpt",

    # SQL
    "duckdb",

    # Visualization
    "matplotlib",
    "seaborn",
    "plotly",
    "plotnine",
    "adjustText",

    # Dashboards
    "panel",
    "streamlit",

    # Parallel computing / performance
    "joblib",
    "dask",
    # llvmlite 0.46+ does not publish Intel macOS wheels.
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

# This folder is a working environment, not an installable package.
[tool.uv]
package = false
