[project]
name = "use-python"
version = "1.0.4"
description = "Shared Python environment for Financial Data Analytics and Empirical Economics"
requires-python = ">=3.12"
dependencies = [
    # Environment
    "jupyterlab",
    "ipywidgets",

    # Data
    "pandas",
    "polars",
    "polars-ds",  # data-science extensions for polars
    "polars-ols",  # OLS regression for polars
    "numpy",
    "pyarrow",
    "openpyxl",
    "xlrd",  # opening excel legacy format
    "fastexcel",  # fast excel reading (polars backend)

    # Data access
    "requests",
    "yfinance",
    "wrds",
    "openassetpricing",
    "tidyfinance",

    # Web scraping / HTML tables
    "beautifulsoup4",
    "html5lib",
    "lxml",
    "playwright",

    # Statistics / econometrics
    "scipy",
    "statsmodels",
    "linearmodels",
    "pyfixest",
    "scikit-learn",
    "arch",

    # Portfolio optimization
    "PyPortfolioOpt",

    # SQL
    "duckdb",

    # Visualization
    "matplotlib",
    "seaborn",
    "plotly",
    "plotnine",
    "adjustText",

    # Dashboards
    "panel",
    "streamlit",

    # NLP, transformers, and LLMs
    "torch",
    "transformers",
    "datasets",
    "sentence-transformers",
    "accelerate",
    "openai",
    "ollama",

    # Parallel computing / performance
    "joblib",
    "dask",
    "numba",
]

# This folder is a working environment, not an installable package.
[tool.uv]
package = false
